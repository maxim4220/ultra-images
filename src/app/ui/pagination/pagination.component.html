@if (pagination().count > 0) {
  <nav aria-label="Image results pagination" data-cy="pagination">
    <ul class="pagination pagination-lg">
      <li class="page-item" [class.disabled]="!hasPrevious()">
        <button
          class="page-link"
          type="button"
          [disabled]="!hasPrevious()"
          (click)="goToPrevious()"
          aria-label="Previous page"
          data-cy="pagination-previous"
        >
          Previous
        </button>
      </li>
      @if (hasPrevious()) {
        <li class="page-item">
          <button class="page-link" type="button" (click)="goToPrevious()" [attr.aria-label]="'Page ' + (currentPage() - 1)">
            {{ currentPage() - 1 }}
          </button>
        </li>
      }
      <li class="page-item active">
        <button
          class="page-link"
          type="button"
          [attr.aria-current]="'page'"
          [attr.aria-label]="'Page ' + currentPage()"
          data-cy="pagination-current"
        >
          {{ currentPage() }}
        </button>
      </li>
      @if (hasNext()) {
        <li class="page-item">
          <button class="page-link" type="button" (click)="goToNext()" [attr.aria-label]="'Page ' + (currentPage() + 1)">
            {{ currentPage() + 1 }}
          </button>
        </li>
      }
      <li class="page-item" [class.disabled]="!hasNext()">
        <button
          id="next-page"
          class="page-link"
          type="button"
          [disabled]="!hasNext()"
          (click)="goToNext()"
          aria-label="Next page"
          data-cy="pagination-next"
        >
          Next
        </button>
      </li>
    </ul>
  </nav>
}
