<div class="ap-main-container">
  <h1 id="main-page-title" data-cy="page-title">Welcome to giphy search page!</h1>
  <app-image-search (searchSubmitted)="onSearch($event)"></app-image-search>

  @if (showWelcome()) {
    <h3 id="ap-description" class="mt-4" data-cy="welcome-message">Please enter your search parameters...</h3>
  }

  @if (errorMessage(); as message) {
    <h3 class="mt-4 text-center" role="alert" data-cy="error-message">{{ message }}</h3>
  }

  @if (isLoading()) {
    <app-spinner></app-spinner>
  } @else if (showResults()) {
    @defer (on immediate) {
      <app-image-list [images]="images()"></app-image-list>
    } @placeholder {
      <app-spinner></app-spinner>
    }

    @if (pagination(); as pagination) {
      <app-pagination [pagination]="pagination" (pageOffsetChange)="onPageOffsetChange($event)"></app-pagination>
    }
  }
</div>
